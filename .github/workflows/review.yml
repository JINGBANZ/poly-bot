name: PR Review — Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install py-clob-client requests feedparser duckduckgo-search pytest

      - name: Run tests
        run: |
          python -m pytest bot/tests/ -q --tb=short
