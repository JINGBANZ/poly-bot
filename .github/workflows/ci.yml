name: CI — Smoke Tests

on:
  push:
    branches: [main]
    paths: ['bot/**', 'bot/tests/**', 'requirements*.txt', '.github/workflows/ci.yml']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements-test.txt

      - name: Run smoke tests
        run: |
          python -m pytest bot/tests/test_smoke.py -v --tb=short

      - name: Run full test suite
        run: |
          python -m pytest bot/tests/ -v --tb=short
