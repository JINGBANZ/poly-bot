name: CI — Smoke Tests

on:
  push:
    branches: [main]
    paths: ['bot/**', 'bot/tests/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install py-clob-client requests feedparser duckduckgo-search pytest

      - name: Run smoke tests
        run: |
          python -m pytest bot/tests/test_smoke.py -v --tb=short

      - name: Run full test suite
        run: |
          python -m pytest bot/tests/ -v --tb=short
